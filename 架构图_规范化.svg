<svg viewBox="0 0 720 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
  <text x="30" y="32" font-size="17" font-weight="bold" fill="#111827">跨境电商 AI 生态 · 分层与依赖方向</text>
  <text x="30" y="50" font-size="11" fill="#6b7280">三个仓库、依赖单向；底座只做编排、留痕与自进化，模型接入与检索在共享集群里</text>

  <!-- ③ 应用层 -->
  <rect x="30" y="66" width="660" height="72" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="46" y="88" font-size="13" font-weight="bold" fill="#b45309">③ 应用层 · ecommerce-ai-workbench</text>
  <rect x="46" y="98" width="300" height="28" rx="4" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
  <text x="56" y="116" font-size="12" fill="#92400e">数据中台（RAG 知识库 · 平台数据打通）</text>
  <rect x="362" y="98" width="312" height="28" rx="4" fill="#f59e0b" fill-opacity="0.18" stroke="#f59e0b"/>
  <text x="372" y="116" font-size="12" fill="#92400e">业务 Agent 集群 · 单容器交付</text>

  <line x1="360" y1="140" x2="360" y2="160" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ① 底座层（本仓库） -->
  <rect x="30" y="164" width="660" height="152" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="46" y="186" font-size="13" font-weight="bold" fill="#1d4ed8">① 底座层 · ecom-agent-runtime（本仓库）</text>

  <rect x="46" y="196" width="300" height="46" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6"/>
  <text x="56" y="214" font-size="12" fill="#1e40af">双引擎编排</text>
  <text x="56" y="232" font-size="11" fill="#1e40af">LangGraph 状态图 ＋ 自研 ReAct Loop</text>

  <rect x="362" y="196" width="312" height="46" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6"/>
  <text x="372" y="214" font-size="12" fill="#1e40af">自进化闭环</text>
  <text x="372" y="232" font-size="11" fill="#1e40af">轨迹 → 归因 → 补丁 → 回放比通过率</text>

  <rect x="46" y="250" width="300" height="46" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6"/>
  <text x="56" y="268" font-size="12" fill="#1e40af">意图路由 · 编排策略注入</text>
  <text x="56" y="286" font-size="11" fill="#1e40af">规则分类到 5 类业务域 · policy 可覆盖</text>

  <rect x="362" y="250" width="312" height="46" rx="4" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6"/>
  <text x="372" y="268" font-size="12" fill="#1e40af">MCP 服务入口 · 组装门面</text>
  <text x="372" y="286" font-size="11" fill="#1e40af">stdio / HTTP 共用一套 JSON-RPC</text>

  <line x1="360" y1="318" x2="360" y2="338" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ② 共享集群 -->
  <rect x="30" y="342" width="660" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="46" y="364" font-size="13" font-weight="bold" fill="#047857">② 共享集群 · ecom-agent-shared（独立仓库 · pip 可安装）</text>
  <rect x="46" y="374" width="300" height="28" rx="4" fill="#10b981" fill-opacity="0.18" stroke="#10b981"/>
  <text x="56" y="392" font-size="12" fill="#065f46">LLM 网关（四厂商统一接入）· RAG as a Service</text>
  <rect x="362" y="374" width="312" height="28" rx="4" fill="#10b981" fill-opacity="0.18" stroke="#10b981"/>
  <text x="372" y="392" font-size="12" fill="#065f46">记忆 · Prompt 注册中心 · MCP 工具协议</text>

  <text x="30" y="440" font-size="11" fill="#374151">依赖方向：③ → ① → ② 单向；共享层不认识任何业务模块，业务数据经依赖注入进入。</text>
  <text x="30" y="458" font-size="10" fill="#9ca3af">颜色＝架构分层（橙＝应用层　蓝＝底座层　绿＝共享层）</text>
</svg>
